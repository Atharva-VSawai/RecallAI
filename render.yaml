services:
  - type: web
    name: recall-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ORIGINS
        value: https://recall-ai-86lp-omega.vercel.app
      - key: FRONTEND_URL
        value: https://recall-ai-86lp-omega.vercel.app
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_REDIRECT_URI
        value: https://my-backend-bdxc.onrender.com/integrations/teams/oauth/callback
      - key: TEAMS_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GRAPH_WEBHOOK_URL
        value: https://my-backend-bdxc.onrender.com/integrations/teams/notifications
      - key: TEAMS_WEBHOOK_CLIENT_STATE
        sync: false
      - key: MOCK_TEAMS_TRANSCRIPTS
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        value: recall
      - key: COHERE_API_KEY
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
